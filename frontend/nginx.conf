server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend container at request time via Docker's embedded DNS,
    # so backend restarts (new container IP) do not leave nginx with a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # Never cache the SPA shell; hashed assets are immutable and safe to cache.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 512;

    # API: same-origin proxy to the Go backend.
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Unversioned liveness probe for orchestrators.
    location = /healthz {
        proxy_pass $backend_upstream;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
